# ToolBet v2 — copy thanh config.yaml

site:
  # Chi cac web trong src/sites (vipbet389, 222b) — chon tren panel login
  url: "https://vipbet389.com/"
  cdp_url: "http://localhost:9222"

game:
  table_name: "Baccarat C01"
  provider: "ae_sexy"
  table_id: null
  skip_tie: true

betting:
  # Muc 0 = van theo doi (khong dat chip), van tinh thang/thua trong nhom
  stakes: [0, 100, 110, 120, 130, 140, 150, 160, 170, 180, 190, 200, 220, 240, 260, 280, 300]
  default_side: "player"
  auto_bet: false
  stop_loss: 500.0
  take_profit: 5000.0
  group_take_profit: 80.0
  group_stop_loss: 200.0
  # loss_up_win_reset | win_up_loss_reset | both_up | win_up_loss_hold | profit_lock_loss_up
  progression_mode: loss_up_win_reset
  # Mode1: thua ve 0 cho thang; thang o 0 moi nhay gỡ theo loss_count
  loss_watch_recover: false
  tie_nurture:
    enabled: false
    preset: thu_can_bang
    gap_min: 18
    gap_max: 25
    max_bets: 3
    stake: 100
    payout: 8.0
    session_stop_loss: 3000.0

patterns:
  mau_1_1: true
  mau_bet_2: true

# So van dieu kien (2 | 3 | 4) — 1-1 = xen ke N van; BetxN = N van cung mau
pattern_lengths:
  mau_1_1: 2
  mau_bet_2: 2

database:
  path: "data/toolbet.db"

logging:
  level: "INFO"

# Workspace HTML giai doan C; co the bat legacy_overlay_enabled de rollback.
ui:
  runtime_v2_enabled: true
  legacy_overlay_enabled: false

# Tai khoan Tool local cho giai doan B. Doi bootstrap_password truoc khi pilot.
tool_auth:
  enabled: true
  account_store_path: "data/tool_accounts.json"
  remembered_credentials_path: "data/tool_login.bin"
  bootstrap_username: "toolbet"
  bootstrap_password: "toolbet"
  session_timeout_minutes: 480

# License thương mại. Private key chỉ nằm trên license server.
# Khi bật, Tool Login xác thực qua API và mọi cược thật cần capability live_bet.
license:
  enabled: false
  # signed = ToolBet license server; baccarat_chrome_agent2 = GitHub + Worker lease.
  provider: "signed"
  api_url: "http://127.0.0.1:8765"
  public_key_path: "data/license_public.pem"
  cache_path: "data/license_session.bin"
  timeout_seconds: 8
  grace_minutes: 60
  refresh_before_minutes: 5
  github_raw_base_url: "https://raw.githubusercontent.com"
  github_owner: "ngomantri1"
  github_repo: "licenses"
  github_branch: "main"
  github_license_path: "auto"
  lease_base_url: "https://net88.ngomantri1.workers.dev/lease/auto"
  lease_app_id: "BaccaratChromeAgent"
  heartbeat_seconds: 600
  reference_client_id_path: "data/reference_license_client_id.txt"
live_execution:
  # disabled = virtual only; pilot = finite lease; production = no pilot lease.
  # Every real mode still checks Tool/license, Risk, pending and journal.
  mode: disabled
